site_name: AI Docs Template
site_description: 本地 AI 生成内容，发布到公网的模板项目
site_url: https://yyzxw.github.io/acknowledge/

theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
    accent: indigo
  features:
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - tables

nav:
  - Home: index.md
  - Documents:
      - Getting Started: getting-started.md
      - Examples: examples.md
  - About: about.md

repo_name: yyzxw/acknowledge
repo_url: https://github.com/yyzxw/acknowledge
edit_uri: blob/main/docs/

plugins:
  - search
