site_name: AI Docs Center
site_description: 多项目文档中心 - 本地 AI 生成，发布到公网
site_url: https://yyzxw.github.io/acknowledge/

theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
    accent: indigo
  features:
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - tables

nav:
  - Home: index.md
  - Projects:
      - Project A: project-a/index.md
      - Project B: project-b/index.md
      - Project C: project-c/index.md

repo_name: yyzxw/acknowledge
repo_url: https://github.com/yyzxw/acknowledge

plugins:
  - search
