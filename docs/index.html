<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acknowledge</title>
  <style>
    :root {
      --bg-0: #060a12;
      --bg-1: #08111f;
      --bg-2: #0d1728;
      --text: #eef7ff;
      --muted: #9eb4ca;
      --cyan: #23d7ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, var(--bg-0), var(--bg-1) 40%, var(--bg-2));
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    .readme {
      max-width: 640px;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #ffffff 0%, var(--cyan) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p {
      color: var(--muted);
      font-size: 1.1rem;
      line-height: 1.8;
      margin-bottom: 1.5rem;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
    }

    a {
      color: var(--cyan);
      text-decoration: none;
      padding: 0.6rem 1.2rem;
      border: 1px solid rgba(35, 215, 255, 0.3);
      border-radius: 8px;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    a:hover {
      background: rgba(35, 215, 255, 0.1);
      border-color: var(--cyan);
    }
  </style>
</head>
<body>
  <div class="readme">
    <h1>Acknowledge</h1>
    <p>项目研究与技术文档汇集。</p>
    <div class="links">
      <a href="./research/list.html">查看研究报告 →</a>
    </div>
  </div>
</body>
</html>
